<style>
/* 11月仮説検証キャンペーンCRのトンマナ（淡いピンクの水彩地・半透明の虹色クリスタル・コーラルの差し色）。

:root {
  --bg: #fdf3f6;
  --ink: #20202a;
  --ink-sub: #6a6573;
  --coral: #f0506e;
  --coral-deep: #d63a5a;
  --card: #ffffffcc;
  --line: #f3d6de;
  --pink: #f0607f;
  --blue: #2f93e0;
  --green: #4bb04a;
  --font-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background:
    radial-gradient(60% 34% at 8% 3%, #ffd9e6 0, transparent 70%),
    radial-gradient(50% 30% at 96% 8%, #d9e9ff 0, transparent 70%),
    radial-gradient(60% 26% at 70% 96%, #fff0c9 0, transparent 70%),
    var(--bg);
  background-color: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; gap: 26px; }
.wrap > * { min-width: 0; }

/* ヘッダー */
.brand { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 900; font-size: 13px; }
.brand .tag { background: var(--coral); color: #fff; border-radius: 999px; padding: 2px 11px; font-size: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 6.4vw, 34px); line-height: 1.2; margin: 6px 0 0; text-wrap: balance; }
h1 em { font-style: normal; color: var(--coral); }
.asof { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--ink-sub); font-size: 12.5px; font-weight: 700; margin-top: 2px; }
.asof .demo { border: 1.5px dashed var(--coral); color: var(--coral-deep); border-radius: 999px; padding: 0 9px; font-size: 11.5px; }

/* 1画面目：宝石の山 */
.hero { display: grid; justify-items: center; gap: 4px; text-align: center; }
.score { display: flex; align-items: baseline; justify-content: center; gap: 6px; line-height: 1; }
.score .num { font-family: var(--font-display); font-weight: 800; font-size: clamp(60px, 18vw, 88px); color: var(--coral); font-variant-numeric: tabular-nums; }
.score .of { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 7vw, 34px); color: var(--ink); font-variant-numeric: tabular-nums; }
.score .of small { font-family: var(--font-body); font-size: 15px; font-weight: 900; margin-left: 2px; }
.remain { font-weight: 900; font-size: 14px; color: var(--ink-sub); }
.remain b { color: var(--coral-deep); font-variant-numeric: tabular-nums; }
.illu { width: 100%; max-width: 640px; height: auto; display: block; overflow: hidden; border-radius: 22px; margin-top: 4px; box-shadow: 0 14px 40px #c9a8f544; background: #fff; }
.cap { margin: 0; color: var(--ink-sub); font-size: 12.5px; font-weight: 700; }
.chip { display: inline-flex; gap: 8px; align-items: baseline; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px; font-size: 13px; font-weight: 700; color: var(--ink-sub); }
.chip b { font-family: var(--font-display); font-size: 18px; color: var(--ink); font-variant-numeric: tabular-nums; }

/* 2画面目：12個のガラス瓶 */
.sec-head { display: grid; gap: 2px; }
.sec-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; margin: 0; }
.sec-head p { margin: 0; color: var(--ink-sub); font-size: 13px; font-weight: 700; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px 10px 14px; box-shadow: 0 6px 24px #f0506e14; }
.cols { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; align-items: end; }
.col { display: grid; gap: 4px; justify-items: center; }
.col .n { font-family: var(--font-display); font-weight: 800; font-size: 17px; line-height: 1; font-variant-numeric: tabular-nums; }
.col .n.zero { color: #b9a9b1; }
.col svg { width: 100%; height: auto; display: block; overflow: visible; }
.col .no { font-size: 11px; font-weight: 900; color: var(--ink-sub); font-variant-numeric: tabular-nums; }
.col.g-pink .n:not(.zero) { color: var(--pink); }
.col.g-blue .n:not(.zero) { color: var(--blue); }
.col.g-green .n:not(.zero) { color: var(--green); }
.tags { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; margin-top: 6px; }
.tags span { text-align: center; font-weight: 900; font-size: 12px; color: #fff; border-radius: 8px; padding: 1px 0; white-space: nowrap; }
.tags .g-pink { background: var(--pink); grid-column: span 7; }
.tags .g-blue { background: var(--blue); grid-column: span 2; }
.tags .g-green { background: var(--green); grid-column: span 3; }
.vacant { margin: 10px 0 0; background: #fff; border: 1.5px solid var(--coral); border-radius: 14px; padding: 9px 12px; font-size: 13.5px; font-weight: 700; }
.vacant b { color: var(--coral-deep); }

/* 凡例 */
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.legend li { display: flex; gap: 10px; align-items: center; background: #ffffffd9; border-radius: 12px; padding: 8px 12px; font-size: 13.5px; font-weight: 700; }
.legend .no { flex: none; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-weight: 900; font-size: 12.5px; display: grid; place-items: center; }
.legend .txt { flex: 1; min-width: 0; line-height: 1.4; }
.legend .c { flex: none; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--ink-sub); }
.legend .c b { font-family: var(--font-display); font-size: 18px; color: var(--ink); }
.legend .zero .c b { color: #b9a9b1; }

.cta { display: block; text-align: center; text-decoration: none; background: var(--coral); color: #fff; font-weight: 900; font-size: 17px; padding: 16px 18px; border-radius: 16px; box-shadow: 0 8px 20px #f0506e40; }

.foot { text-align: center; color: var(--ink-sub); font-size: 12.5px; font-weight: 700; margin: 0; }

/* 宝石が1粒ずつ現れる */
.pop { transform-box: fill-box; transform-origin: center; animation: pop .55s cubic-bezier(.2,.9,.3,1.3) both; }
@keyframes pop { from { opacity: 0; transform: scale(.15); } to { opacity: 1; transform: scale(1); } }
.twinkle { transform-box: fill-box; transform-origin: center; opacity: 0; animation: twinkle 1.2s ease-in-out 1 both; }
@keyframes twinkle { 0%, 100% { opacity: 0; } 45% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pop, .twinkle { animation: none; } }

/* 添付の告知画像から、進捗へ一度だけつなぐ。読み込み失敗時も閉じる。 */
.intro { position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:#fff7fa; overflow:hidden; transition:opacity .65s ease,visibility .65s; }
.intro::before { content:""; position:absolute; inset:-8%; background:url("intro-background.png") center/cover no-repeat; }
.intro img { position:relative; width:min(100%,1000px); height:auto; max-height:92dvh; object-fit:contain; mask-image:linear-gradient(to right,transparent,#000 3%,#000 97%,transparent),linear-gradient(to bottom,transparent,#000 5%,#000 94%,transparent); mask-composite:intersect; animation:intro-drift 1.8s ease-out both; }
.intro.done { opacity:0; visibility:hidden; pointer-events:none; }
@keyframes intro-drift { from { opacity:0; transform:translateY(14px) scale(.97); } 35% { opacity:1; } to { opacity:1; transform:translateY(0) scale(1); } }
body.introducing .pop, body.introducing .twinkle { animation-play-state:paused; }
body.introducing { overflow:hidden; }
@media(prefers-reduced-motion:reduce) { .intro { display:none; } .intro img,.twinkle { animation:none; } body.introducing { overflow:auto; } }
/* 到達したごほうびの鍵を一度だけ開く。導入中は待機する。 */
.reward-lock .shackle { transform-origin:-10px 0; }
.milestone.reached .shackle { animation:reward-unlock .8s ease .25s both; }
@keyframes reward-unlock { from { transform:translateY(0) rotate(0); } to { transform:translateY(-7px) rotate(-32deg); } }
body.introducing .shackle { animation-play-state:paused; }
@media(prefers-reduced-motion:reduce) { .milestone.reached .shackle { animation:none; transform:translateY(-7px) rotate(-32deg); } }

document.body.classList.add('introducing');
(() => {
  const intro = document.getElementById('intro');
  let finished = false;
  const finish = () => { if(finished) return; finished=true; intro.classList.add('done'); document.body.classList.remove('introducing'); setTimeout(()=>intro.remove(),700); };
  const img = intro.querySelector('img');
  const ready = () => setTimeout(finish,1800);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
  else if(img.complete) ready();
  else { img.addEventListener('load',ready,{once:true}); img.addEventListener('error',finish,{once:true}); }
  setTimeout(finish,4000);
})();

const GLASS = "M3 4H41L37 188Q36 197 28 197H16Q8 197 7 188Z";
function slotPos(i) {
  const row = Math.floor(i / 2), side = i % 2;
  return { x: (side ? 29.5 : 14.5) + (rnd(i + 7) - 0.5) * 1.6, y: 184 - row * 12.4 - (side ? 5.5 : 0) };
}
function glass(count, g) {
  let s = '<path d="' + GLASS + '" fill="#fff" fill-opacity=".55"/>';
  const cap = DATA.perGoal;
  for (let i = count; i < cap; i++) {
    const p = slotPos(i);
    s += '<g transform="translate(' + p.x.toFixed(1) + " " + p.y.toFixed(1) + ') scale(.62)" opacity=".55"><use href="#gem-ghost"/></g>';
  }
  for (let i = 0; i < Math.min(count, cap); i++) {
    const p = slotPos(i), rot = (rnd(i + 31) - 0.5) * 34;
    s += '<g transform="translate(' + p.x.toFixed(1) + " " + p.y.toFixed(1) + ") rotate(" + rot.toFixed(1) + ') scale(.78)"><use class="pop" style="animation-delay:' + (300 + i * 70) + 'ms" href="#gem-' + g + '"/></g>';

  return s;
}
